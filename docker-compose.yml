version: '3.8'

services:
  demo-api:
    image: node:20-alpine
    working_dir: /app/demo-backend-node
    volumes:
      - .:/app
    ports:
      - "3001:3000"
    command: node dist/index.js
    environment:
      - PORT=3000
      - DOMAIN=localhost:3001
      - JWT_SECRET=super-secret-tcc-key-change-in-production
      - RPC_URL=https://ethereum-rpc.publicnode.com
      - TOKEN_ADDRESS=0x514910771AF9Ca656af840dff83E8264EcF986CA
      - MIN_BALANCE=1.0

  test:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    profiles:
      - test
    command: sh -c "cd sdk-server-node && npx vitest run"
