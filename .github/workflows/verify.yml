name: Verify Ancora and demos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Build and start the complete local environment
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Login, SSO, protected routes and developer portal inside Docker
        run: npm run test:e2e:compose
      - name: Preserve credentials and databases across container recreation
        shell: bash
        run: |
          docker compose stop
          # The stopped container's files remain in the named volume. Hash the files
          # with a one-off container, then compare after the full stack is recreated.
          before=$(docker compose run --rm --no-deps --entrypoint sha256sum ancora /data/provider.json /data/demo-a.json /data/demo-b.json)
          docker compose down
          docker compose up -d --wait --wait-timeout 120
          after=$(docker compose exec -T ancora sha256sum /data/provider.json /data/demo-a.json /data/demo-b.json)
          test "$before" = "$after"
          docker compose exec -T ancora node --input-type=module -e 'import { DatabaseSync } from "node:sqlite"; for (const file of ["demo-a.sqlite", "demo-b.sqlite"]) { const db = new DatabaseSync("/data/" + file, { readOnly: true }); if (db.prepare("SELECT count(*) AS total FROM app_users").get().total < 1) process.exitCode = 1; db.close(); }'
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Clean up the isolated CI environment
        if: always()
        run: docker compose down --volumes
