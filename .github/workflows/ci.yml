name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tcc
          POSTGRES_PASSWORD: tcc_ci_only
          POSTGRES_DB: tcc_auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tcc -d tcc_auth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tcc:tcc_ci_only@127.0.0.1:5432/tcc_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # npm install resolves Rollup's platform-specific optional binary for Ubuntu.
      # npm ci on a Windows-generated lockfile treats that optional entry as a hard
      # dependency and aborts before Vitest can start.
      - run: npm install --include=optional --no-audit --no-fund
      # The lockfile is maintained on Windows, so npm does not materialize
      # Rollup's Linux optional package on this Ubuntu runner. Install the
      # official tarball directly without changing the versioned lockfile.
      - name: Install Rollup Linux binary
        shell: bash
        run: |
          mkdir -p node_modules/@rollup
          curl -fsSL https://registry.npmjs.org/@rollup/rollup-linux-x64-gnu/-/rollup-linux-x64-gnu-4.63.3.tgz \
            | tar -xz -C node_modules/@rollup
          mv node_modules/@rollup/package node_modules/@rollup/rollup-linux-x64-gnu
      - run: npm run setup
      - run: npm run typecheck
      - name: Wait for PostgreSQL
        run: node scripts/wait-postgres.mjs
      - name: Run npm test
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee npm-test.log; then
            summary=$(tail -n 25 npm-test.log | tr '\n' ' ' | cut -c1-4000)
            echo "::error title=Vitest failure::$summary"
            exit 1
          fi
        shell: bash
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
