name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tcc
          POSTGRES_PASSWORD: tcc_ci_only
          POSTGRES_DB: tcc_auth
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tcc -d tcc_auth"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://tcc:tcc_ci_only@127.0.0.1:5432/tcc_auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm run typecheck
      - name: Wait for PostgreSQL
        run: node scripts/wait-postgres.mjs
      - name: Run npm test
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee npm-test.log; then
            summary=$(tail -n 25 npm-test.log | tr '\n' ' ' | cut -c1-4000)
            echo "::error title=Vitest failure::$summary"
            exit 1
          fi
        shell: bash
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
