[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ancora-flask"
version = "0.1.0"
description = "Cliente Flask para o login OIDC do Âncora"
requires-python = ">=3.10"
dependencies = ["Flask>=3,<4", "Authlib>=1.6,<2", "requests>=2.32,<3"]

[tool.setuptools]
py-modules = ["ancora_flask"]
